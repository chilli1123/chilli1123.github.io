<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="The Loyalist — Loyola High School student news."><title>The Loyalist | Loyola High School</title>
<style>
:root{--ink:#080808;--paper:#f3f0e8;--red:#a90e18;--line:rgba(243,240,232,.27);--muted:#aaa69d}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ink);color:var(--paper);font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}img{display:block;width:100%;height:100%;object-fit:cover}.wrap{width:min(100% - 36px,1600px);margin:auto}.label{font-size:.68rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.utility{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);color:var(--muted)}.mast{display:grid;grid-template-columns:1fr auto;align-items:end;gap:30px;padding:28px 0 20px;border-bottom:3px solid}.mast h1{margin:0;font:900 clamp(4rem,13.5vw,13rem)/.72 Arial Black,Arial,sans-serif;letter-spacing:-.09em;text-transform:uppercase}.mast p{margin:0;text-align:right;line-height:1.5}.nav{display:flex;gap:26px;overflow:auto;padding:14px 0;border-bottom:1px solid var(--line);scrollbar-width:none}.nav a{flex:none}.nav a:hover{color:#ff4550}.cover{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,.65fr);min-height:calc(100vh - 210px);border-bottom:1px solid var(--line)}.cover-media{position:relative;overflow:hidden;background:#171717}.cover-media img{filter:saturate(.7) contrast(1.08);transition:transform .8s}.cover:hover img{transform:scale(1.02)}.badge{position:absolute;z-index:2;top:18px;left:18px;background:var(--red);padding:8px 10px}.cover-copy{display:flex;flex-direction:column;justify-content:space-between;padding:30px;border-left:1px solid var(--line)}.cover h2{margin:16px 0 20px;font:900 clamp(2.7rem,5vw,5.7rem)/.9 Arial Black,Arial,sans-serif;letter-spacing:-.055em;text-transform:uppercase;overflow-wrap:anywhere}.dek{color:#d1cec6;font:1.08rem/1.45 Georgia,serif}.meta{display:flex;justify-content:space-between;gap:14px;margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:.65rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.scrolly{position:relative}.sticky{position:sticky;top:0;height:100vh;overflow:hidden;background:#111}.sticky img{position:absolute;inset:0;filter:brightness(.34) grayscale(1);transition:opacity .4s}.sticky:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.72))}.chapter{position:absolute;z-index:2;left:3vw;bottom:3vw;margin:0;color:rgba(255,255,255,.18);font:900 clamp(5rem,17vw,17rem)/.72 Arial Black,Arial,sans-serif;letter-spacing:-.09em}.steps{position:relative;z-index:3;margin-top:-100vh;padding:20vh 4vw 25vh 52vw}.step{min-height:92vh;display:flex;align-items:center}.card{width:min(100%,560px);padding:25px;background:rgba(8,8,8,.9);border-top:5px solid var(--red);backdrop-filter:blur(8px);box-shadow:0 20px 60px #000}.card-media{aspect-ratio:16/10;margin-bottom:20px;overflow:hidden;background:#222}.card h3,.tile h3{font-family:Arial Black,Arial,sans-serif;letter-spacing:-.045em;text-transform:uppercase}.card h3{margin:12px 0;font-size:clamp(1.8rem,3.5vw,3.8rem);line-height:.95}.card p{color:#cbc7bf;font:1rem/1.45 Georgia,serif}.card:hover h3{color:#ff4550}.latest-head{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:70px 0 16px;border-bottom:3px solid}.latest-head h2{margin:0;font:900 clamp(3.7rem,10vw,10rem)/.72 Arial Black,Arial,sans-serif;letter-spacing:-.075em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(12,1fr)}.tile{grid-column:span 4;padding:20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.tile:nth-child(3n+1){border-left:1px solid var(--line)}.tile-media{aspect-ratio:4/5;margin-bottom:16px;overflow:hidden;background:#1d1d1d}.tile img{filter:grayscale(1);transition:.5s}.tile:hover img{filter:none;transform:scale(1.025)}.tile h3{margin:10px 0;font-size:clamp(1.45rem,2.4vw,2.8rem);line-height:.98}.footer{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:55px 0}.footer strong{font:900 clamp(2.5rem,7vw,7rem)/.8 Arial Black,Arial,sans-serif;letter-spacing:-.06em;text-transform:uppercase}.status{min-height:70vh;display:grid;place-items:center;text-align:center;text-transform:uppercase;font-weight:800;letter-spacing:.12em}.error a{text-decoration:underline}
@media(max-width:900px){.mast{grid-template-columns:1fr}.mast p{text-align:left}.cover{grid-template-columns:1fr}.cover-media{min-height:65vh}.cover-copy{border-left:0;border-top:1px solid var(--line)}.steps{padding:18vh 5vw 20vh 30vw}.tile{grid-column:span 6}.tile:nth-child(3n+1){border-left:0}.tile:nth-child(2n+1){border-left:1px solid var(--line)}}@media(max-width:600px){.wrap{width:min(100% - 24px,1600px)}.utility span:last-child{display:none}.mast h1{font-size:18vw}.cover-media{min-height:54vh}.sticky{height:78vh}.steps{margin-top:-78vh;padding:55vh 12px 12vh}.step{min-height:86vh}.chapter{top:30px;bottom:auto}.tile{grid-column:1/-1;border-left:1px solid var(--line)!important}.tile-media{aspect-ratio:4/3}.footer{display:block}.footer p{margin-top:25px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}img{transition:none!important}}
</style></head><body><div id="app"><div class="status">Loading the newsroom…</div></div>
<script>
(()=>{const SITE='https://theloyalist.org',API=`${SITE}/wp-json/wp/v2/posts?per_page=12&_embed=1`,app=document.querySelector('#app');const sections=[['Arts & Entertainment','arts-entertainment'],['Feature','feature'],['News','news'],['Opinion','opinion'],['Satire','satire'],['Sports','sports']];const decode=(v='')=>{const e=document.createElement('textarea');e.innerHTML=v;return e.value.replace(/<[^>]*>/g,'').trim()},terms=p=>p._embedded?.['wp:term']?.[0]||[],section=p=>decode(terms(p)[0]?.name||'Latest'),media=p=>p._embedded?.['wp:featuredmedia']?.[0],photo=p=>media(p)?.media_details?.sizes?.large?.source_url||media(p)?.source_url||'',alt=p=>decode(media(p)?.alt_text||media(p)?.caption?.rendered||p.title.rendered),date=d=>new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(new Date(d)),safe=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])),image=(p,lazy=true)=>photo(p)?`<img src="${safe(photo(p))}" alt="${safe(alt(p))}" ${lazy?'loading="lazy"':''}>`:'<div class="status">The Loyalist</div>',nav=sections.map(([n,s])=>`<a class="label" href="${SITE}/category/${s}/">${n}</a>`).join('');
fetch(API).then(r=>{if(!r.ok)throw Error();return r.json()}).then(posts=>{if(posts.length<4)throw Error();const[lead,...rest]=posts,features=rest.slice(0,3),tiles=rest.slice(3);app.innerHTML=`<header class="wrap"><div class="utility label"><span>The official news site of Loyola High School</span><span>Los Angeles, California</span></div><div class="mast"><h1>The Loyalist</h1><p class="label">Student voices.<br>Campus stories.<br>Since 1963.</p></div><nav class="nav" aria-label="News sections">${nav}</nav></header><main><a class="cover wrap" href="${safe(lead.link)}"><div class="cover-media"><span class="badge label">Cover story</span>${image(lead,false)}</div><div class="cover-copy"><div><span class="label">${safe(section(lead))}</span><h2>${safe(decode(lead.title.rendered))}</h2><p class="dek">${safe(decode(lead.excerpt.rendered))}</p></div><div class="meta"><span>Read full story →</span><time>${date(lead.date)}</time></div></div></a><section class="scrolly" aria-label="Featured stories"><div class="sticky"><div id="scene">${image(features[0],false)}</div><h2 class="chapter" id="chapter">01</h2></div><div class="steps">${features.map((p,i)=>`<article class="step" data-index="${i}"><a class="card" href="${safe(p.link)}"><div class="card-media">${image(p)}</div><span class="label">0${i+1} / ${safe(section(p))}</span><h3>${safe(decode(p.title.rendered))}</h3><p>${safe(decode(p.excerpt.rendered))}</p><div class="meta"><span>Continue reading →</span><time>${date(p.date)}</time></div></a></article>`).join('')}</div></section><section class="wrap"><div class="latest-head"><h2>Latest</h2><span class="label">From the newsroom</span></div><div class="grid">${tiles.map((p,i)=>`<article class="tile"><a href="${safe(p.link)}"><div class="tile-media">${image(p)}</div><span class="label">${String(i+5).padStart(2,'0')} / ${safe(section(p))}</span><h3>${safe(decode(p.title.rendered))}</h3><div class="meta"><span>Read story →</span><time>${date(p.date)}</time></div></a></article>`).join('')}</div></section></main><footer class="footer wrap"><strong>The Loyalist</strong><p class="label">© ${new Date().getFullYear()} Loyola High School<br><a href="${SITE}">Visit the SNO site →</a></p></footer>`;const scene=document.querySelector('#scene'),chapter=document.querySelector('#chapter');let active=-1;const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){const i=Number(e.target.dataset.index);if(i!==active){active=i;scene.innerHTML=image(features[i],false);chapter.textContent=`0${i+1}`}}}),{rootMargin:'-40% 0px -40% 0px'});document.querySelectorAll('.step').forEach(s=>observer.observe(s))}).catch(()=>{app.innerHTML=`<div class="status error">The newsroom feed could not load.<br><a href="${SITE}">Open The Loyalist</a></div>`})})();
</script></body></html>
